name: build

# Push to the release branch to ship:
#   git push origin main:release
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/app/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/myfilehero/sloptube:latest
            ghcr.io/myfilehero/sloptube:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
